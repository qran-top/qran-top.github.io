name: Sync with Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync from Source Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # إضافة المستودع الأول وجلب بياناته
          git remote add upstream https://github.com/kw-co/qran.top.git
          git fetch upstream
          
          # معرفة الفرع الافتراضي الحالي
          CURRENT_BRANCH=$(git branch --show-current)
          
          # جلب التعديلات واستبدالها بنسخة الأصل بدقة
          git merge upstream/main --allow-unrelated-histories -X theirs -m "Sync from upstream" || \
          git merge upstream/master --allow-unrelated-histories -X theirs -m "Sync from upstream"
          
          # رفع التحديثات
          git push origin $CURRENT_BRANCH
