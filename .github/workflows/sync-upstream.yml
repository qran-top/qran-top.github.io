name: Sync, Build and Deploy

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync from Upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/kw-co/qran.top.git || true
          git fetch upstream
          CURRENT_BRANCH=$(git branch --show-current)
          git merge upstream/$CURRENT_BRANCH --allow-unrelated-histories -X theirs -m "Sync upstream" || \
          git merge upstream/main --allow-unrelated-histories -X theirs -m "Sync upstream" || \
          git merge upstream/master --allow-unrelated-histories -X theirs -m "Sync upstream" || true
          git push origin $CURRENT_BRANCH || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build
        run: |
          npm install
          npm run build

      - name: Verify Build Output
        id: set-dir
        run: |
          if [ -d "dist" ]; then
            echo "out_dir=dist" >> $GITHUB_OUTPUT
          elif [ -d "build" ]; then
            echo "out_dir=build" >> $GITHUB_OUTPUT
          elif [ -d "out" ]; then
            echo "out_dir=out" >> $GITHUB_OUTPUT
          else
            echo "out_dir=." >> $GITHUB_OUTPUT
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.set-dir.outputs.out_dir }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
